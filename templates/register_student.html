<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Register Student</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="form-container">

    <h1>Student Registration</h1>

    <form method="POST">

        <input
            type="text"
            name="name"
            placeholder="Student Name"
            required
        >

        <input
            type="text"
            name="student_class"
            placeholder="Class"
            required
        >

        <input
            type="text"
            name="roll_no"
            placeholder="Roll Number"
            required
        >

        <input
            type="text"
            name="subjects"
            placeholder="AI|Maths|ML"
            required
        >

        <button type="submit">

            Register Student

        </button>

    </form>

    {% if qr_image %}

        <h2>{{ student_id }}</h2>

        <img
            src="{{ url_for('static', filename=qr_image) }}"
            width="250"
        >

    {% endif %}

</div>

</body>
</html>
