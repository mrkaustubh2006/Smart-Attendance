
<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<title>QR Scanner</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

body{
    background:#0f172a;
    color:white;
    font-family:Arial;
    text-align:center;
}

h1{
    margin-top:20px;
}

select{
    padding:10px;
    font-size:18px;
    margin:10px;
}

button{
    padding:10px 20px;
    font-size:18px;
    cursor:pointer;
}

#reader{
    width:500px;
    margin:auto;
    margin-top:30px;
}

#result{
    margin-top:20px;
    font-size:24px;
    font-weight:bold;
}

</style>

</head>

<body>

<h1>QR Attendance Scanner</h1>

<select id="subject">
    <option value="">Select Subject</option>
    <option value="Maths">Maths</option>
    <option value="AI">AI</option>
    <option value="ML">ML</option>
    <option value="DS">DS</option>
    <option value="ELC">ELC</option>
</select>

<button onclick="startScanner()">
    Start Scanning
</button>

<div id="reader"></div>

<div id="result">
    Select Subject & Start Scanner
</div>

<script>

let scannerStarted = false;
let lastScan = "";

function startScanner()
{
    let subject =
        document.getElementById("subject").value;

    if(subject === "")
    {
        alert("Select Subject First");
        return;
    }

    if(scannerStarted)
    {
        return;
    }

    scannerStarted = true;

    let scanner =
    new Html5QrcodeScanner(
        "reader",
        {
            fps:10,
            qrbox:250
        }
    );

    scanner.render(onScanSuccess);
}

function onScanSuccess(decodedText)
{
    let subject =
        document.getElementById("subject").value;

    if(decodedText === lastScan)
    {
        return;
    }

    lastScan = decodedText;

    fetch("/mark_attendance",
    {
        method:"POST",

        headers:
        {
            "Content-Type":"application/json"
        },

        body:JSON.stringify({
            student_id:decodedText,
            subject:subject
        })
    })

    .then(response => response.json())

    .then(data =>
    {
        document.getElementById(
            "result"
        ).innerHTML = data.message;

        setTimeout(() =>
        {
            lastScan = "";
        },2000);
    })

    .catch(error =>
    {
        document.getElementById(
            "result"
        ).innerHTML = "❌ Error";
    });
}

</script>

</body>
</html>
