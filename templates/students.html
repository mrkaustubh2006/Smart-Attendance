<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<title>Students</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="table-container">

<h1>Registered Students</h1>

<table>

<tr>

<th>ID</th>
<th>Name</th>
<th>Class</th>
<th>Roll No</th>
<th>Subjects</th>

</tr>

{% for s in students %}

<tr>

<td>{{ s.StudentID }}</td>
<td>{{ s.Name }}</td>
<td>{{ s.Class }}</td>
<td>{{ s.RollNo }}</td>
<td>{{ s.Subjects }}</td>

</tr>

{% endfor %}

</table>

</div>

</body>
</html>
